  <body class="bg-light">

    <div class="container py-5">
      <h2 class="text-center mb-4">Contact Me</h2>
      <div class="row justify-content-center">
        <div class="col-md-6">
          <form>
            <div class="mb-3">
              <label for="name" class="form-label">Name</label>
              <input type="text" class="form-control" id="name" placeholder="Your Name" />
            </div>
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input type="email" class="form-control" id="email" placeholder="Your Email" />
            </div>
            <div class="mb-3">
              <label for="message" class="form-label">Message</label>
              <textarea class="form-control" id="message" rows="5" placeholder="Your Message"></textarea>
            </div>
            <button type="submit" class="btn btn-primary w-100">Send Message</button>
          </form>

          <div class="mt-4 text-center">
            <p>Email: <a href="mailto:yourname@example.com">yourname@example.com</a></p>
            <p>Phone: (123) 456-7890</p>
          </div>
        </div>
      </div>
    </div>

    <script>
      // Bootstrap form validation
      (function () {
        const form = document.getElementById("contactForm");

        form.addEventListener("submit", function (event) {
          event.preventDefault(); // stop form from submitting
          if (!form.checkValidity()) {
            event.stopPropagation();
          } else {
            alert("Thanks! Your message is ready to be sent.");
            form.reset();
          }
          form.classList.add("was-validated");
        });
      })();
    </script>

    <script type="module" src="./javascripts.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"></script>

    <script>
      // Prevent dropdown toggle link from scrolling to top
      document.querySelectorAll(".dropdown-toggle").forEach((toggle) => {
        toggle.addEventListener("click", function (e) {
          e.preventDefault() // <-- stops default anchor jump
        })
      })
    </script>
    <script>
      // Make all dropdowns open on hover
      document.querySelectorAll(".dropdown").forEach((drop) => {
        const toggle = drop.querySelector(".dropdown-toggle")
        const menu = drop.querySelector(".dropdown-menu")

        drop.addEventListener("mouseenter", () => {
          const bsDropdown = bootstrap.Dropdown.getOrCreateInstance(toggle)
          bsDropdown.show()
        })

        drop.addEventListener("mouseleave", () => {
          const bsDropdown = bootstrap.Dropdown.getOrCreateInstance(toggle)
          bsDropdown.hide()
        })
      })
    </script>
